<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SAMUEL AI Voice Assistant</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: radial-gradient(circle at top, #0f172a, #020617);
  font-family:Arial;
  color:white;
}

/* MAIN CARD */
.container{
  text-align:center;
  background: rgba(255,255,255,0.05);
  padding:40px;
  border-radius:20px;
  backdrop-filter: blur(10px);
  box-shadow:0 0 40px rgba(0,0,0,0.4);
  width:320px;
}

/* 🎤 ORB */
.orb{
  width:160px;
  height:160px;
  border-radius:50%;
  background:linear-gradient(135deg,#3b82f6,#06b6d4);
  margin:20px auto;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:60px;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 0 40px rgba(59,130,246,0.5);
}

.orb:hover{
  transform:scale(1.08);
}

/* PULSE */
.orb.listening{
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%{transform:scale(1); box-shadow:0 0 20px #3b82f6;}
  50%{transform:scale(1.1); box-shadow:0 0 60px #06b6d4;}
  100%{transform:scale(1); box-shadow:0 0 20px #3b82f6;}
}

/* STATUS */
.status{
  margin-top:20px;
  font-size:16px;
  opacity:0.9;
}

/* TEXT */
.user-text{
  margin-top:15px;
  font-size:14px;
  color:#cbd5e1;
}

/* 🎯 UPGRADED DROPDOWN */
select{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  outline:none;
  background:rgba(255,255,255,0.08);
  color:white;
  font-size:14px;
  cursor:pointer;
  margin-bottom:10px;
  backdrop-filter: blur(10px);
  transition:0.3s;
}

select:hover{
  background:rgba(255,255,255,0.15);
}

select option{
  color:black;
}
</style>
</head>

<body>

<div class="container">
<select id="langMode">
  <option value="en-twi">English → Twi</option>
  <option value="twi-en">Twi → English</option>
</select>
  <div
    class="orb"
    id="orb"
    onclick="startListening()"
  >
    🎤
  </div>

  <div class="status" id="status">
    Click to Speak
  </div>

  <div class="user-text" id="userText"></div>

</div>

<script>

// LOAD VOICES
window.speechSynthesis.onvoiceschanged = () => {
  speechSynthesis.getVoices();
};

let recognition;

// 🎤 START LISTENING
function startListening(){

  speechSynthesis.cancel();

  const orb =
    document.getElementById("orb");

  const status =
    document.getElementById("status");

  orb.classList.add("listening");

  status.innerText =
    "Listening...";

  recognition =
    new (
      window.SpeechRecognition ||
      window.webkitSpeechRecognition
    )();

 const mode = document.getElementById("langMode").value;

if (mode === "en-twi") {
  recognition.lang = "en-US";
} 
else if (mode === "twi-en") {
  recognition.lang = "ak-GH"; // Twi (Akan Ghana)
} 
else {
  recognition.lang = "en-US"; // fallback auto
}

  recognition.interimResults = false;

  recognition.start();

  // USER FINISHED TALKING
  recognition.onresult = async (event) => {

    const text =
      event.results[0][0].transcript;

    document.getElementById(
      "userText"
    ).innerText = text;

    orb.classList.remove(
      "listening"
    );

    status.innerText =
      "Thinking...";

    await askAI(text);
  };

  recognition.onerror = () => {

    orb.classList.remove(
      "listening"
    );

    status.innerText =
      "Mic Error";
  };
}

// 🧠 ASK AI
async function askAI(message){

  try{

    const res =
      await fetch(
        "https://samuel-lang-translator.onrender.com/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            message
          })
        }
      );

    const data =
      await res.json();

    document.getElementById(
      "status"
    ).innerText =
      "Speaking...";

    speakBot(data.reply);

  }catch(err){
  console.log("FULL ERROR:", err);
  status.innerText = err.message || "Connection Error";
}
}

function speakBot(text){

  speechSynthesis.cancel();

  const isTwi = /[ɛɔŋ]/.test(text);

  const utter =
    new SpeechSynthesisUtterance(text);

  utter.rate = 0.85;
  utter.pitch = 0.9;

  // If Twi → slower clearer voice
  if(isTwi){
    utter.lang = "en-GB";
  } else {
    utter.lang = "en-US";
  }

  const voices = speechSynthesis.getVoices();
  utter.voice = voices.find(v =>
    v.lang.includes("en")
  ) || voices[0];

  speechSynthesis.speak(utter);
}
</script>

</body>
</html>
